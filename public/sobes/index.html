<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Шпаргалка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=31">
<script>try { const t = localStorage.getItem('sobes:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="side__logo" href="#/"><span>{ }</span>Шпаргалка</a>
    <nav class="side__nav" id="sideNav" aria-label="Разделы"></nav>
  </aside>
  <div class="side-scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn top__menu" id="menuBtn" type="button" aria-label="Меню">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="search">
        <label class="search__box" for="q">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Найти тему: замыкание, useFetch, гидратация…" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div class="search__results" id="searchResults" hidden></div>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Сменить тему">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="data/js.js?v=31"></script>
<script src="data/js2.js?v=31"></script>
<script src="data/vue.js?v=31"></script>
<script src="data/nuxt.js?v=31"></script>
<script src="data/ts.js?v=31"></script>
<script src="data/test.js?v=31"></script>
<script src="data/perf.js?v=31"></script>
<script src="data/arch.js?v=31"></script>
<script src="core.js?v=31"></script>
<script src="demos.js?v=31"></script>
<script src="app.js?v=31"></script>
</body>
</html>
